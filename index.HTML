<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Commerciaux</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <header class="bg-blue-600 text-white p-4 sticky top-0 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold mx-auto">Consultation Catalogue</h1>
        <button onclick="fetchArticles()" class="absolute right-4 text-white opacity-80 hover:opacity-100 focus:outline-none">
            🔄
        </button>
    </header>

    <main class="p-4 max-w-md mx-auto">
    <div class="sticky top-[60px] z-50 bg-gray-100 pb-4 pt-1">
        <input type="text" id="searchBar" onkeyup="filterArticles()" placeholder="Rechercher par code ou nom..." 
               class="w-full p-3 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-gray-800">
    </div>

        <div id="catalogList" class="space-y-3">
            <div class="flex flex-col items-center justify-center py-12 text-gray-500">
                <span class="animate-spin text-2xl mb-2">⏳</span>
                <p>Chargement du catalogue en cours...</p>
            </div>
        </div>
    </main>

    <script>
        // L'URL relative '/api/articles' élimine définitivement les erreurs CORS de Chrome sur Android
        const API_URL = "/api/articles"; 
        let articlesData = [];

        // Fonction principale de récupération des prix depuis le serveur Python
        async function fetchArticles() {
            const container = document.getElementById('catalogList');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Réponse serveur incorrecte");
                articlesData = await response.json();
                renderArticles(articlesData);
            } catch (error) {
                console.error("Erreur de récupération :", error);
                container.innerHTML = `
                    <div class="p-4 bg-red-100 text-red-700 rounded-lg text-center shadow-xs border border-red-200">
                        <p class="font-bold">Erreur de chargement</p>
                        <p class="text-xs mt-1 text-red-500">Le serveur de prix est inaccessible ou le réseau a été coupé.</p>
                        <button onclick="fetchArticles()" class="mt-3 bg-red-600 text-white px-4 py-1.5 rounded-lg text-xs font-semibold uppercase tracking-wider">
                            Réessayer
                        </button>
                    </div>`;
            }
        }

        // Fonction de génération de l'affichage HTML pour chaque article
        function renderArticles(articles) {
            const container = document.getElementById('catalogList');
            if (articles.length === 0) {
                container.innerHTML = `
                    <p class="text-center text-gray-500 py-8 bg-white rounded-xl shadow-xs border border-gray-200">
                        Aucun article ne correspond à votre recherche.
                    </p>`;
                return;
            }

            container.innerHTML = articles.map(art => `
                <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-200 flex justify-between items-center transition active:bg-gray-50">
                    <div class="flex-1 pr-3">
                        <span class="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded-sm inline-block">
                            ${art.code || 'N/A'}
                        </span>
                        <h3 class="text-base font-semibold text-gray-800 mt-1 line-clamp-2">${art.designation || 'Sans nom'}</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Stock : <span class="font-bold text-gray-700">${art.stock ?? 0}</span></p>
                    </div>
                    <div class="text-right whitespace-nowrap">
                        <span class="text-lg font-bold text-blue-600">${(art.prix ?? 0).toFixed(3)} DT</span>
                    </div>
                </div>
            `).join('');
        }

        // Fonction de filtrage en temps réel lors de la saisie
        function filterArticles() {
    // On récupère la saisie, on la passe en minuscules et on la sépare par mot s'il y a des espaces
    const query = document.getElementById('searchBar').value.trim().toLowerCase();
    const searchWords = query.split(' ').filter(word => word.length > 0);
    
    if (articlesData.length === 0) return;

    // Si la barre de recherche est vide, on réaffiche tout
    if (searchWords.length === 0) {
        renderArticles(articlesData);
        return;
    }

    // Filtrage intelligent : chaque mot tapé doit se trouver SOIT dans le code, SOIT dans la désignation
    const filtered = articlesData.filter(art => {
        const code = (art.code || "").toLowerCase();
        const designation = (art.designation || "").toLowerCase();
        
        // On vérifie que TOUS les mots tapés correspondent à l'article
        return searchWords.every(word => 
            code.includes(word) || designation.includes(word)
        );
    });

    renderArticles(filtered);

        }

        // Lancement automatique du chargement à l'ouverture de la page
        window.onload = fetchArticles;
    </script>
</body>
</html>
